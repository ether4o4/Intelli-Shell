name: Polish verification
on:
  pull_request:
    types: [labeled]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: polish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.label.name == 'polish-verify' && github.head_ref == 'polish/mobile-2026-10-05'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test without generating signing credentials
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac :app:testDebugUnitTest :app:lintDebug --no-daemon --max-workers=2
      - name: Upload build and validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polish-validation
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/reports/**
            frontend/build/
            artifacts/reports/
            artifacts/apk/
