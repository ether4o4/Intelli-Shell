name: Publish IntelliShell APK

# Builds the debug-signed APK on every push to main and refreshes a rolling
# "android-preview" release marked --latest, so this URL always serves the newest:
#   https://github.com/ether4o4/Intelli-Shell/releases/latest/download/intellishell.apk
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      asset_name:
        description: 'APK file name'
        required: false
        default: intellishell.apk

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Generate debug keystore
        run: |
          # Deterministic debug keystore so the APK sideloads/updates in place.
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        if: github.event_name != 'pull_request'
        env:
          ASSET_NAME: ${{ github.event.inputs.asset_name || 'intellishell.apk' }}
        run: |
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "Staging $APK -> dist/${ASSET_NAME}"
          cp "$APK" "dist/${ASSET_NAME}"
          ls -la dist/

      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_NAME: ${{ github.event.inputs.asset_name || 'intellishell.apk' }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.sha }}
        run: |
          BUILT_AT=$(date -u '+%Y-%m-%d %H:%M UTC')
          SHORT_SHA=${GITHUB_SHA::7}
          SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          NOTES=$(printf '%s\n\n%s\n%s' \
            "IntelliShell — Termux + a built-in AI agent. Uses stock Termux as the Linux backend. Enable 'Install unknown apps' to sideload." \
            "**This build:** [\`${SHORT_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) — ${SUBJECT}" \
            "**Built:** ${BUILT_AT} (run #${GITHUB_RUN_NUMBER})")
          gh release delete android-preview --yes --cleanup-tag 2>/dev/null || true
          gh release create android-preview dist/* \
            --title "IntelliShell — Android Preview (build ${SHORT_SHA})" \
            --notes "$NOTES" \
            --latest
